<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>The Resinistas - Home</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fff5fb, #ead9f2);
        }

        .navbar {
            background: white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .brand {
            color: #7b4b9a;
            font-size: 26px;
            font-weight: bold;
        }

        .home {
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .home-card {
            background: white;
            padding: 60px;
            border-radius: 30px;
            box-shadow: 0 10px 35px #cdb8d5;
            max-width: 750px;
        }

        .success {
            font-size: 60px;
        }

        h1 {
            color: #7b4b9a;
            font-size: 42px;
        }

        .btn-custom {
            background: #7b4b9a;
            color: white;
            border-radius: 25px;
            padding: 12px 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }

        .btn-custom:hover {
            background: #63377e;
            color: white;
        }
    </style>
</head>
<body>
<!-- NAVBAR -->

<nav class="navbar">

    <div class="container">

        <span class="brand">
            ✨ The Resinistas
        </span>

        <a href="products.html"
           class="btn btn-outline-dark">

            🛍️ Products

        </a>

    </div>

</nav>



<!-- HOME -->

<div class="home">

    <div class="home-card">

        <div class="success">
            ✅
        </div>

        <h1>
            Login Successful!
        </h1>

        <h2>
            Welcome to The Resinista ✨
        </h2>

        <p class="mt-3">
            You have successfully logged in.
        </p>

        <p>
            Welcome to our world of
            <b>beautiful handmade resin art.</b>
        </p>


        <!-- GO TO PRODUCTS -->

        <a
            href="products.html"
            class="btn-custom">

            🛍️ Explore Our Products

        </a>

    </div>

</div>


</body>

</html>
